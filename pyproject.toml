[project]
name = "pipelinemedic"
version = "0.0.1"
description = "Agentic incident triage for dbt + Dagster data pipelines"
requires-python = ">=3.13"
dependencies = [
    # Phase 0 / 1: graph, model provider, tracing, warehouse reads.
    # Floors match the majors in uv.lock; the 1.x LangGraph API is assumed.
    "langgraph>=1.0",
    # Phase 2: SQLite checkpoints so a run paused for review resumes elsewhere.
    "langgraph-checkpoint-sqlite>=3.0",
    "langchain-core>=1.0",
    "langchain-google-genai>=4.0",
    "langfuse>=4.0",
    "duckdb>=1.3",
    "python-dotenv>=1.0",
    "pydantic>=2.8",
    "typer>=0.15",
    # Phase 2: the GitHub REST call in open_pull_request. Local git is a subprocess.
    "httpx>=0.27",
    "pyyaml>=6.0",
    "langchain>=1.0",
]

[project.optional-dependencies]
anthropic = ["langchain-anthropic>=0.3"]
# Optional LLM-judge metric; the core eval suite is plain pytest.
judge = ["deepeval>=3.0"]
# Phase 4: webhook receiver + run API
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
medic = "medic.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["medic", "chaos"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
